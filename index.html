<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chord Sheets">
<title>Chord Sheet Maker</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#dcd8cf;
  --accent:#1f5fbf; --chord:#b3261e; --btn:#ece9e1; --btn-ink:#1d1d1f;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#17171a; --panel:#1f1f23; --ink:#ececee; --muted:#9a9aa2; --line:#33333a;
         --accent:#7aa7f0; --chord:#ff8a80; --btn:#2c2c33; --btn-ink:#ececee; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,select,input{font:inherit;color:var(--btn-ink)}
button{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:active{filter:brightness(.92)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;min-width:0;color:var(--ink)}
select{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px;max-width:100%}
label.chk{display:inline-flex;align-items:center;gap:6px;min-height:40px}

header.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px;
  padding-top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .grow{flex:1 1 160px;min-width:0}
.keybox{display:inline-flex;align-items:center;gap:4px}
.keybox output{min-width:3.2em;text-align:center;font-weight:700}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.tabs,.onlyphone{display:none}

main{flex:1;min-height:0;display:flex}
#editorPane,#sheetPane{flex:1 1 50%;min-width:0;min-height:0;overflow:auto}
#editorPane{border-right:1px solid var(--line);display:flex;flex-direction:column}
#editorTools{padding:8px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
#src{flex:1;width:100%;border:0;outline:0;resize:none;padding:14px;background:var(--panel);color:var(--ink);
  font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
#sheetPane{padding:20px 22px 60px}
#sheet{background:var(--panel);max-width:900px;margin:0 auto;padding:22px 26px;border-radius:10px;border:1px solid var(--line)}

/* ---- the chord sheet itself ---- */
#sheet h1{margin:0 0 2px;font-size:1.6em;line-height:1.2}
#sheet .sub{color:var(--muted);margin:0}
#sheet .meta{margin:8px 0 14px;font-size:.85em;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
#sheet .meta b{color:var(--ink)}
#body.cols2{column-count:2;column-gap:36px}
.sec{margin:0 0 1.1em;break-inside:avoid}
.sec.chorus{border-left:3px solid var(--accent);padding-left:12px}
.sec .lbl{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.25em}
.ln{margin:0 0 .35em;line-height:1.25}
.ln.plain{white-space:pre-wrap}
.w{display:inline-block;white-space:nowrap;vertical-align:bottom}
.p{display:inline-flex;flex-direction:column;vertical-align:bottom}
.ch{color:var(--chord);font-weight:700;font-size:.88em;line-height:1.15;padding-right:.4em;white-space:pre}
.ly{white-space:pre;line-height:1.3}
.note{margin:.2em 0 .5em;padding:.3em .6em;background:var(--btn);border-radius:6px;font-style:italic;font-size:.92em}
pre.tab{font:.85em/1.3 ui-monospace,Menlo,Consolas,monospace;margin:0 0 .6em;overflow:auto}
.nochords .ch{display:none}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 14px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:9}
#toast button{min-height:30px;padding:4px 10px}

@media (max-width:800px){
  .tabs{display:flex;gap:6px}
  .onlyphone{display:inline-block}
  .more{display:none}
  header.bar.open .more{display:flex}
  button,select{min-height:38px;padding:6px 10px;font-size:15px}
  header.bar{gap:6px}
  .tabs button{flex:1}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{display:block}
  #editorPane,#sheetPane{height:100%;border:0}
  body[data-view="edit"] #sheetPane{display:none}
  body[data-view="sheet"] #editorPane{display:none}
  #sheetPane{padding:10px 8px 60px}
  #sheet{padding:14px 14px;border-radius:8px}
  #body.cols2{column-count:1}
  #src{font-size:16px} /* stops iOS zooming on focus */
}

@media print{
  @page{margin:.6in}
  html,body{height:auto;background:#fff;display:block}
  header.bar,#editorPane,#toast{display:none!important}
  main{display:block!important}
  /* print area counts as "narrow", so undo the phone-view rules that hide the sheet */
  body[data-view] #sheetPane,#sheetPane{display:block!important;height:auto!important;overflow:visible!important;padding:0!important}
  #body.cols2{column-count:2!important}
  #sheet{border:0;padding:0;max-width:none;background:#fff;color:#000}
  #sheet .sub,#sheet .meta{color:#444}
  #sheet .meta b,#sheet .ly,#sheet h1,#sheet .note{color:#000}
  .ch{color:#000}
  .sec.chorus{border-left-color:#000}
  .sec .lbl{color:#000}
  .note{background:#eee}
}
</style>
</head>
<body data-view="edit">

<header class="bar">
  <div class="row">
    <input id="songSearch" class="grow" type="search" placeholder="Search songs" aria-label="Search songs" autocomplete="off" autocapitalize="off">
    <select id="songSel" class="grow" aria-label="Song"></select>
    <button id="moreBtn" class="onlyphone">More ▾</button>
  </div>
  <div class="row">
    <span class="keybox">
      <button id="down" aria-label="Transpose down">♭ −</button>
      <output id="keyOut">Key</output>
      <button id="up" aria-label="Transpose up">+ ♯</button>
    </span>
    <button id="smaller" aria-label="Smaller text">A−</button>
    <button id="bigger" aria-label="Bigger text">A+</button>
    <button id="pdfBtn" class="primary">Save PDF</button>
    <button id="printBtn">Print</button>
  </div>
  <div class="row more" id="more">
    <button id="newBtn">New</button>
    <button id="dupBtn">Copy</button>
    <button id="delBtn">Remove</button>
    <select id="showSel" aria-label="Show chords as">
      <option value="asis">Chords as written</option><option value="letters">Show as letters</option><option value="numbers">Show as Nashville numbers</option>
    </select>
    <select id="accSel" aria-label="Sharps or flats">
      <option value="auto">Auto ♯/♭</option><option value="sharp">Use ♯</option><option value="flat">Use ♭</option>
    </select>
    <label class="chk"><input type="checkbox" id="twoCol"> 2 columns</label>
    <label class="chk"><input type="checkbox" id="showCh" checked> Chords</label>
    <button id="libBtn" title="Search a whole folder of songs without importing them. Option-click to choose a different folder.">Open library folder</button>
    <input type="file" id="libInput" webkitdirectory directory multiple hidden>
    <button id="bothBtn">Save .cho + PDF</button>
    <button id="expBtn">Export .cho</button>
    <button id="impBtn">Import</button>
    <input type="file" id="impFile" accept=".cho,.chopro,.crd,.txt,.pro,.docx,.pdf,text/plain" multiple hidden>
  </div>
  <div class="tabs">
    <button id="tabEdit" class="on">Edit</button>
    <button id="tabSheet">Sheet</button>
  </div>
</header>

<main>
  <section id="editorPane">
    <div id="editorTools">
      <button id="brk">[ ] chord</button>
      <button id="conv" title="Turn pasted chords-over-lyrics (Ultimate Guitar style) into ChordPro">Convert pasted chords-over-lyrics</button>
      <button id="help">Cheat sheet</button>
    </div>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  </section>
  <section id="sheetPane"><article id="sheet"></article></section>
</main>

<div id="toast"><span id="toastMsg"></span><button id="toastBtn">Undo</button></div>

<script>
(function(){
'use strict';

/* ---------- storage (safe if blocked) ---------- */
var LS = {
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
};

var SAMPLE = [
'{title: Amazing Grace}',
'{subtitle: Public domain}',
'{key: G}',
'',
'{start_of_verse: Verse 1}',
'[G]Amazing [G7]grace, how [C]sweet the [G]sound',
'That [G]saved a [Em]wretch like [D]me',
'I [G]once was [G7]lost, but [C]now am [G]found',
'Was [Em]blind, but [D]now I [G]see',
'{end_of_verse}',
'',
'{comment: Tip: put each chord in [brackets] right where it lands in the word.}',
''
].join('\n');

/* ---------- state ---------- */
var songs = [], cur = null, steps = 0;
var settings = { size:18, cols:false, chords:true, acc:'auto', show:'asis' };

try{ var s = JSON.parse(LS.get('csm.settings')||'null'); if(s) for(var k in s) settings[k]=s[k]; }catch(e){}
try{ songs = JSON.parse(LS.get('csm.songs')||'[]'); }catch(e){ songs=[]; }
if(!Array.isArray(songs)) songs=[];
if(!songs.length) songs=[{id:uid(), text:SAMPLE, steps:0}];
var lastId = LS.get('csm.last');
cur = songs.filter(function(x){return x.id===lastId})[0] || songs[0];

function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
var warnedFull=false;
function saveAll(){
  var ok=LS.set('csm.songs', JSON.stringify(songs)); LS.set('csm.last', cur.id);
  if(!ok && !warnedFull){ warnedFull=true; toast('This device is out of room for songs. Export what you need, then use Remove on the rest.'); }
  if(ok) warnedFull=false;
}
function saveSettings(){ LS.set('csm.settings', JSON.stringify(settings)); }

/* ---------- music theory ---------- */
var SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
var FLAT_MAJ=[5,10,3,8,1,6], FLAT_MIN=[2,7,0,5,10,3];

function tNote(n, st, flats){
  var i=IDX[n]; if(i===undefined) return n;
  return (flats?FLAT:SHARP)[((i+st)%12+12)%12];
}
function tChord(c, st, flats){
  if(!st) return c;
  var m=c.match(/^([A-G][#b]?)([^\/]*)(?:\/([A-G][#b]?))?$/);
  if(!m) return c;
  return tNote(m[1],st,flats)+m[2]+(m[3]?'/'+tNote(m[3],st,flats):'');
}
function useFlats(meta, text){
  if(settings.acc==='flat') return true;
  if(settings.acc==='sharp') return false;
  if(meta.key){
    var m=meta.key.match(/^([A-G][#b]?)(m|min)?/);
    if(m && IDX[m[1]]!==undefined){
      var i=((IDX[m[1]]+steps)%12+12)%12;
      return (m[2]?FLAT_MIN:FLAT_MAJ).indexOf(i)>=0;
    }
  }
  return /\[[A-G]b/.test(text);
}

/* ---------- Nashville numbers <-> letters ---------- */
var DEG=[0,2,4,5,7,9,11];
var NUMSEMI=['1','b2','2','b3','3','4','#4','5','b6','6','b7','7'];
var CTX={mode:'asis',key:null,steps:0,flats:false};
function keyIdx(meta){
  var m=(meta.key||'').match(/^([A-G][#b]?)/);
  return (m && IDX[m[1]]!==undefined) ? IDX[m[1]] : null;
}
function isNum(c){ return /^[#b]?[1-7]/.test(c); }
function numSemi(a1,d,a2){
  var a=a1||a2; return DEG[+d-1]+(a==='#'?1:a==='b'?-1:0);
}
function dispChord(c){
  var m, k=CTX.key;
  if(isNum(c)){
    if(CTX.mode==='asis'||CTX.mode==='numbers'||k===null) return c;
    m=c.match(/^([#b]?)([1-7])([#b]?)([^\/]*)(?:\/([#b]?)([1-7])([#b]?))?$/);
    if(!m) return c;
    var names=CTX.flats?FLAT:SHARP, base=k+CTX.steps+120;
    var root=names[(base+numSemi(m[1],m[2],m[3]))%12];
    var bass=m[6]?'/'+names[(base+numSemi(m[5],m[6],m[7]))%12]:'';
    return root+m[4]+bass;
  }
  if(CTX.mode==='numbers'){
    if(k===null) return c;
    m=c.match(/^([A-G][#b]?)([^\/]*)(?:\/([A-G][#b]?))?$/);
    if(!m) return c;
    var r=NUMSEMI[(IDX[m[1]]-k+120)%12];
    var b=m[3]?'/'+NUMSEMI[(IDX[m[3]]-k+120)%12]:'';
    return r+m[2]+b;
  }
  return tChord(c,CTX.steps,CTX.flats);
}

/* ---------- ChordPro parser ---------- */
var ALIAS={t:'title',st:'subtitle',su:'subtitle',c:'comment',ci:'comment',cb:'comment',comment_italic:'comment',comment_box:'comment',
  soc:'start_of_chorus',eoc:'end_of_chorus',sov:'start_of_verse',eov:'end_of_verse',
  sob:'start_of_bridge',eob:'end_of_bridge',sot:'start_of_tab',eot:'end_of_tab'};
function parse(text){
  var meta={}, blocks=[], blk=null;
  function open(type,label,implicit){ blk={type:type,label:label||'',implicit:!!implicit,lines:[]}; blocks.push(blk); }
  text.split(/\r?\n/).forEach(function(raw){
    if(/^\s*#/.test(raw)) return;
    var d=raw.match(/^\s*\{\s*([^:}\s]+)\s*:?\s*(.*?)\s*\}\s*$/);
    if(d){
      var n=d[1].toLowerCase(); n=ALIAS[n]||n; var v=d[2];
      if(n==='comment'){ if(!blk||blk.implicit){ open('verse','',true); } blk.lines.push({note:v}); return; }
      if(/^start_of_(chorus|verse|bridge|tab)$/.test(n)){ open(n.slice(9),v,false); return; }
      if(/^end_of_/.test(n)){ blk=null; return; }
      meta[n]=v; return;
    }
    if(raw.trim()===''){
      if(blk && blk.implicit) blk=null;
      else if(blk) blk.lines.push({blank:true});
      return;
    }
    if(!blk) open('verse','',true);
    blk.lines.push({text:raw});
  });
  return {meta:meta, blocks:blocks};
}

/* ---------- renderer ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderLine(text, st, flats){
  var parts=text.split(/\[([^\]]*)\]/), segs=[];
  if(parts[0]!=='') segs.push({chord:'',text:parts[0]});
  for(var i=1;i<parts.length;i+=2) segs.push({chord:parts[i],text:parts[i+1]||''});
  if(!segs.some(function(s){return s.chord})) return '<div class="ln plain">'+(esc(text)||'&nbsp;')+'</div>';

  // group into words so a line only wraps between words, never mid-word
  var words=[[]];
  segs.forEach(function(s){
    var bits=s.text.split(/(\s+)/);
    bits.forEach(function(b,i){
      if(b===''&&i>0) return;
      words[words.length-1].push({chord:i===0?s.chord:'',text:b});
      if(i%2===1) words.push([]);
    });
  });
  var html=words.map(function(w){
    if(!w.length) return '';
    return '<span class="w">'+w.map(function(p){
      var ch=p.chord?esc(dispChord(p.chord)):'&nbsp;';
      return '<span class="p"><span class="ch">'+ch+'</span><span class="ly">'+(esc(p.text)||'&nbsp;')+'</span></span>';
    }).join('')+'</span>';
  }).join('');
  return '<div class="ln">'+html+'</div>';
}

function render(){
  var text=cur.text, song=parse(text), m=song.meta, flats=useFlats(m,text), h='';
  CTX={mode:settings.show,key:keyIdx(m),steps:steps,flats:flats};
  var title=m.title||'Untitled';
  h+='<h1>'+esc(title)+'</h1>';
  if(m.subtitle) h+='<p class="sub">'+esc(m.subtitle)+'</p>';
  if(m.artist) h+='<p class="sub">'+esc(m.artist)+'</p>';
  var bits=[];
  if(m.key){
    var k=tChord(m.key,steps,flats);
    bits.push('<span>Key <b>'+esc(k)+'</b>'+(steps?' (original '+esc(m.key)+')':'')+'</span>');
  }
  if(m.capo) bits.push('<span>Capo <b>'+esc(m.capo)+'</b></span>');
  if(m.tempo) bits.push('<span>Tempo <b>'+esc(m.tempo)+'</b></span>');
  if(m.time) bits.push('<span>Time <b>'+esc(m.time)+'</b></span>');
  if(bits.length) h+='<div class="meta">'+bits.join('')+'</div>';

  if(settings.show!=='asis' && CTX.key===null) h+='<div class="note">To convert between letters and numbers, add a key line, for example {key: G}</div>';
  h+='<div id="body"'+(settings.cols?' class="cols2"':'')+'>';
  song.blocks.forEach(function(b){
    h+='<div class="sec '+b.type+'">';
    if(b.label) h+='<div class="lbl">'+esc(b.label)+'</div>';
    if(b.type==='tab'){
      h+='<pre class="tab">'+b.lines.map(function(l){return l.text===undefined?'':esc(l.text)}).join('\n')+'</pre>';
    } else {
      b.lines.forEach(function(l){
        if(l.note!==undefined) h+='<div class="note">'+esc(l.note)+'</div>';
        else if(l.blank) h+='<div class="ln">&nbsp;</div>';
        else h+=renderLine(l.text,steps,flats);
      });
    }
    h+='</div>';
  });
  h+='</div>';
  var sheet=document.getElementById('sheet');
  sheet.innerHTML=h;
  sheet.style.fontSize=settings.size+'px';
  sheet.classList.toggle('nochords',!settings.chords);
  document.title=title+' – Chord Sheet';
  document.getElementById('keyOut').textContent = m.key ? tChord(m.key,steps,flats) : (steps>0?'+':'')+steps;
}

/* ---------- song list ---------- */
function titleOf(s){ var m=s.text.match(/\{\s*(?:title|t)\s*:\s*(.*?)\s*\}/i); return m?m[1]:'Untitled'; }
var library=[], libName='';
function plainText(t){ return t.replace(/\{[^}]*\}/g,' ').replace(/\[[^\]]*\]/g,'').toLowerCase(); }
function refreshList(){
  var sel=$('songSel'), q=($('songSearch').value||'').trim().toLowerCase();
  var mine=songs.filter(function(x){
    return !q || x.id===cur.id || titleOf(x).toLowerCase().indexOf(q)>=0 || plainText(x.text).indexOf(q)>=0;
  });
  mine.sort(function(a,b){ return titleOf(a).toLowerCase()<titleOf(b).toLowerCase()?-1:1; });
  var h='<optgroup label="My songs ('+mine.length+')">'+mine.map(function(x){
    return '<option value="'+x.id+'">'+esc(titleOf(x))+'</option>'; }).join('')+'</optgroup>';
  if(library.length){
    if(q.length>=2){
      var hits=[], more=false;
      for(var i=0;i<library.length;i++){
        var L=library[i];
        if(L.title.toLowerCase().indexOf(q)>=0 || L.file.toLowerCase().indexOf(q)>=0 || L.plain.indexOf(q)>=0){
          if(hits.length>=200){ more=true; break; } hits.push(L);
        }
      }
      h+='<optgroup label="Library: '+hits.length+(more?'+':'')+' match'+(hits.length===1?'':'es')+' of '+library.length+'">'+hits.map(function(L){
        return '<option value="lib:'+L.i+'">'+esc(L.title)+'</option>'; }).join('')+'</optgroup>';
    } else {
      h+='<optgroup label="Library: '+library.length+' songs (type 2+ letters to search)"></optgroup>';
    }
  }
  sel.innerHTML=h;
  sel.value=cur.id;
  $('songSearch').placeholder='Search '+songs.length+' song'+(songs.length===1?'':'s')+(library.length?' + '+library.length+' in library':'');
}
function openFromLibrary(i){
  var L=library[i]; if(!L) return;
  var have=songs.filter(function(x){return x.src===L.file && x.text===L.text})[0];
  if(have){ select(have.id); return; }
  var s={id:uid(), text:L.text, steps:0, src:L.file};
  songs.push(s); select(s.id);
}
function select(id){
  cur=songs.filter(function(s){return s.id===id})[0]||songs[0];
  steps=cur.steps||0;
  document.getElementById('src').value=cur.text;
  refreshList(); render(); saveAll();
}

/* ---------- toast ---------- */
var toastFn=null, toastTimer=null;
function toast(msg, undoFn){
  var t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  var b=document.getElementById('toastBtn');
  b.style.display=undoFn?'':'none'; toastFn=undoFn;
  t.style.display='flex'; clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.display='none'}, 6000);
}
document.getElementById('toastBtn').onclick=function(){
  if(toastFn) toastFn(); document.getElementById('toast').style.display='none';
};

/* ---------- chords-over-lyrics converter ---------- */
var CHORD_RE=/^[A-G][#b]?(?:maj|min|m|M|dim|aug|sus|add|\+|-)?[0-9]*(?:(?:sus|add|maj|dim|aug|b|#)?[0-9]+)*(?:\/[A-G][#b]?)?$/;
function isChordLine(l){
  var t=l.trim().split(/\s+/);
  return l.trim()!=='' && t.every(function(x){return CHORD_RE.test(x)});
}
function convertOver(text){
  var lines=text.split(/\r?\n/), out=[];
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(isChordLine(l)){
      var nx=lines[i+1];
      if(nx!==undefined && nx.trim()!=='' && !isChordLine(nx) && !/^\s*\{/.test(nx)){
        var re=/\S+/g, m, hits=[];
        while((m=re.exec(l))) hits.push({i:m.index,c:m[0]});
        var lyric=nx;
        for(var h=hits.length-1;h>=0;h--){
          while(lyric.length<hits[h].i) lyric+=' ';
          lyric=lyric.slice(0,hits[h].i)+'['+hits[h].c+']'+lyric.slice(hits[h].i);
        }
        out.push(lyric.replace(/\s+$/,'')); i++;
      } else {
        out.push(l.trim().split(/\s+/).map(function(c){return '['+c+']'}).join(' '));
      }
    } else out.push(l);
  }
  return out.join('\n');
}

/* ---------- Save PDF (works where the print dialog does not, e.g. iPhone Home Screen apps) ---------- */
var WIN1252={'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'–':0x96,'—':0x97,'…':0x85,'•':0x95,'©':0xa9};
function latin(str){
  var o='';
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<128||(c>=160&&c<=255)) o+=str.charAt(i);
    else if(WIN1252[str.charAt(i)]!==undefined) o+=String.fromCharCode(WIN1252[str.charAt(i)]);
    else if(str.charAt(i)==='♭') o+='b';
    else if(str.charAt(i)==='♯') o+='#';
    else o+='?';
  }
  return o;
}
function pdfStr(str){ return latin(str).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }

function pairStrings(text){
  var parts=text.split(/\[([^\]]*)\]/), segs=[], i;
  if(parts[0]!=='') segs.push({chord:'',text:parts[0]});
  for(i=1;i<parts.length;i+=2) segs.push({chord:parts[i],text:parts[i+1]||''});
  var chords='', lyric='';
  segs.forEach(function(sg,idx){
    while(chords.length<lyric.length) chords+=' ';
    if(sg.chord) chords+=dispChord(sg.chord);
    lyric+=sg.text;
    if(idx<segs.length-1 && lyric.length<chords.length+1){ while(lyric.length<chords.length+1) lyric+=' '; }
  });
  return {chords:chords.replace(/\s+$/,''), lyric:lyric.replace(/\s+$/,''), has:segs.some(function(x){return x.chord})};
}
function wrapPair(c,l,w){
  var out=[];
  while(l.length>w || c.length>w){
    var b=l.lastIndexOf(' ',w);
    if(b<=0) b=w;
    out.push([c.slice(0,b).replace(/\s+$/,''), l.slice(0,b).replace(/\s+$/,'')]);
    c=c.slice(b+1); l=l.slice(b+1);
  }
  out.push([c.replace(/\s+$/,''), l.replace(/\s+$/,'')]);
  return out;
}

function buildPdf(){
  render();                                   // refresh CTX (key, transpose, display mode)
  var song=parse(cur.text), m=song.meta;
  var fs=Math.max(8,Math.min(15,Math.round(settings.size*0.62)));
  var PW=612, PH=792, MG=54, cw=0.6*fs, cols=Math.floor((PW-2*MG)/cw);
  var pages=[[]], y=PH-MG-fs;
  function room(h){ if(y-h<MG){ pages.push([]); y=PH-MG-fs; } }
  function text(font,size,str){ pages[pages.length-1].push('BT /'+font+' '+size+' Tf '+MG+' '+y.toFixed(1)+' Td ('+pdfStr(str)+') Tj ET'); }

  room(fs*3); text('F2',fs+6,m.title||'Untitled'); y-=fs*1.9;
  var subs=[m.subtitle,m.artist].filter(Boolean).join('  -  ');
  if(subs){ text('F1',fs,subs); y-=fs*1.4; }
  var bits=[];
  if(m.key) bits.push('Key '+tChord(m.key,steps,CTX.flats));
  if(m.capo) bits.push('Capo '+m.capo);
  if(m.tempo) bits.push('Tempo '+m.tempo);
  if(m.time) bits.push('Time '+m.time);
  if(bits.length){ text('F3',fs-1,bits.join('   ')); y-=fs*1.5; }
  y-=fs*0.5;

  song.blocks.forEach(function(b){
    room(fs*4);
    if(b.label){ text('F2',fs-1,b.label.toUpperCase()); y-=fs*1.4; }
    b.lines.forEach(function(l){
      if(l.note!==undefined){
        wrapPair('',l.note,cols).forEach(function(r){ room(fs*1.4); text('F3',fs,r[1]); y-=fs*1.4; });
      } else if(l.blank){ y-=fs*0.8; }
      else if(b.type==='tab'){ room(fs*1.3); text('F1',fs,l.text||''); y-=fs*1.3; }
      else {
        var p=pairStrings(l.text), showCh=settings.chords && p.has;
        if(!p.has){ wrapPair('',p.lyric,cols).forEach(function(r){ room(fs*1.4); text('F1',fs,r[1]); y-=fs*1.4; }); return; }
        wrapPair(p.chords,p.lyric,cols).forEach(function(r){
          var drawCh=showCh && r[0].trim()!=='';
          room(fs*(drawCh?2.7:1.4));
          if(drawCh){ text('F2',fs,r[0]); y-=fs*1.15; }
          text('F1',fs,r[1]); y-=fs*1.5;
        });
      }
    });
    y-=fs*0.9;
  });

  /* assemble the PDF file */
  var objs=[], n=pages.length;
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  var kids=[]; for(var i=0;i<n;i++) kids.push((6+i*2)+' 0 R');
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>';
  objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Oblique /Encoding /WinAnsiEncoding >>';
  pages.forEach(function(ops,i){
    var content=ops.join('\n');
    objs[6+i*2]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents '+(7+i*2)+' 0 R >>';
    objs[7+i*2]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  });
  var out='%PDF-1.4\n', offs=[];
  for(var k=1;k<objs.length;k++){ offs[k]=out.length; out+=k+' 0 obj\n'+objs[k]+'\nendobj\n'; }
  var xref=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(k=1;k<objs.length;k++) out+=('0000000000'+offs[k]).slice(-10)+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  var bytes=new Uint8Array(out.length);
  for(i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
function savePdf(){
  var bytes;
  try{ bytes=buildPdf(); }catch(e){ toast('Could not build the PDF: '+e.message); return; }
  var name=(titleOf(cur)||'song').replace(/[\\/:*?"<>|]+/g,'').trim()||'song';
  var blob=new Blob([bytes],{type:'application/pdf'});
  var file=null;
  try{ file=new File([blob],name+'.pdf',{type:'application/pdf'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(function(){});
    return;
  }
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast('PDF saved to your Downloads.');
}

/* ---------- library folder ---------- */
var LIB_EXT=/\.(cho|chopro|crd|pro|txt)$/i;
function setLibrary(items, name){
  library=items.map(function(it,i){
    var m=it.text.match(/\{\s*(?:title|t)\s*:\s*(.*?)\s*\}/i);
    return {i:i, file:it.name, text:it.text, title:m&&m[1]?m[1]:it.name.replace(/\.[^.]+$/,''), plain:plainText(it.text)};
  });
  libName=name||'';
  $('libBtn').textContent='Library: '+library.length+' songs';
  refreshList();
  toast('Library ready: '+library.length+' songs from "'+libName+'". Type in the search box to find one.');
}
function idb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('csm-handles',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('h'); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  });
}
function idbGet(k){ return idb().then(function(d){ return new Promise(function(res){ var q=d.transaction('h').objectStore('h').get(k); q.onsuccess=function(){res(q.result)}; q.onerror=function(){res(null)}; }); }).catch(function(){return null}); }
function idbSet(k,v){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction('h','readwrite'); t.objectStore('h').put(v,k); t.oncomplete=function(){res(true)}; t.onerror=function(){res(false)}; }); }).catch(function(){return false}); }
async function readDir(dir,out,depth){
  for await (const entry of dir.entries()){
    var name=entry[0], h=entry[1];
    if(name.charAt(0)==='.'||name.charAt(0)==='_') continue;
    if(h.kind==='file'){ if(LIB_EXT.test(name)){ var f=await h.getFile(); out.push({name:name,text:await f.text()}); } }
    else if(depth<2) await readDir(h,out,depth+1);
  }
}
async function loadFromHandle(handle){
  toast('Reading library…');
  var out=[]; await readDir(handle,out,0);
  if(!out.length){ toast('No .cho files found in that folder.'); return false; }
  setLibrary(out,handle.name); return true;
}
async function openLibrary(forcePick){
  if(window.showDirectoryPicker){
    try{
      var saved=forcePick?null:await idbGet('lib');
      if(saved){
        var perm=await saved.queryPermission({mode:'read'});
        if(perm!=='granted') perm=await saved.requestPermission({mode:'read'});
        if(perm==='granted'){ if(await loadFromHandle(saved)) return; }
      }
      var h=await window.showDirectoryPicker({id:'chordlib',mode:'read'});
      await idbSet('lib',h);
      await loadFromHandle(h); return;
    }catch(e){ if(e && e.name==='AbortError') return; /* fall through to the plain folder picker */ }
  }
  $('libInput').click();
}
$('libBtn').onclick=function(e){ openLibrary(!!e.altKey); };
$('libInput').onchange=function(){
  var files=[].slice.call(this.files).filter(function(f){
    var rel=f.webkitRelativePath||f.name, base=f.name;
    return LIB_EXT.test(base) && base.charAt(0)!=='.' && base.charAt(0)!=='_' && rel.indexOf('/_')<0;
  });
  if(!files.length){ toast('No .cho files found in that folder.'); return; }
  var root=((files[0].webkitRelativePath||'').split('/')[0])||'folder';
  toast('Reading '+files.length+' files…');
  Promise.all(files.map(function(f){ return f.text().then(function(t){ return {name:f.name,text:t}; }); }))
    .then(function(items){ setLibrary(items,root); });
  this.value='';
};

/* ---------- Word (.docx) and PDF import -> ChordPro ---------- */
var CHORD_RE=/^(?:[A-G][#b]?(?:maj|min|m|M|dim|aug|sus|add|\+|-)?[0-9]*(?:(?:sus|add|maj|dim|aug|b|#)?[0-9]+)*(?:\/[A-G][#b]?)?|\/[A-G][#b]?)$/;
var NASH_RE=/^[1-7][#b]?(?:m|M|sus|dim|aug|[0-9])*(?:\/[1-7][#b]?)?$/;
var SEC_RE=/^\s*[\[(]?\s*(verse|chorus|bridge|pre-?chorus|intro|outro|tag|interlude|ending|instrumental|refrain|turnaround)\s*(\d*)\s*[\])]?\s*:?\s*$/i;
var CREDIT_RE=/(©|\(c\)|copyright|ccli|all rights reserved|written by|words (?:and|&) music|music (?:and|&) lyrics|lyrics by|music by|words by|arr(?:\.|anged)? by|\b(?:19|20)\d\d\b.*(?:music|publishing|records|worship|ministries|songs|integrity|vineyard|hillsong|bethel))/i;
var META_RE=/^(key|tempo|bpm|capo|time|ccli)\s*[:#]/i;
var INLINE_RE=/\s*\(\s*((?:[A-G][#b]?[^\s()]*\s*)+)\)\s*$/;
var nashDoc=false;
function tokClean(x){ return x.replace(/^[(!.,;:]+|[)!.,;:]+$/g,''); }
function lineText(L){ return L.map(function(c){return c.c}).join(''); }
function isChordLine(txt){
  var t=txt.split(/\s+/).map(tokClean).filter(Boolean);
  if(!t.length) return false;
  if(t.every(function(x){return CHORD_RE.test(x)})) return true;
  if(t.every(function(x){return CHORD_RE.test(x)||NASH_RE.test(x)}) && t.some(function(x){return NASH_RE.test(x)})){
    var verseNums=t.every(function(x){return /^[1-9]$/.test(x)});
    if((t.length>=2 && !verseNums) || nashDoc) return true;
  }
  return false;
}
function prescan(lines){
  var letters=0, digits=0;
  lines.forEach(function(L){
    var t=lineText(L).split(/\s+/).map(tokClean).filter(Boolean);
    if(!t.length) return;
    if(t.every(function(x){return CHORD_RE.test(x)})) letters++;
    else if(t.every(function(x){return /^[1-7]$/.test(x)}) || (t.length>=2 && t.every(function(x){return NASH_RE.test(x)}))) digits++;
  });
  nashDoc = digits>=4 && letters<=Math.floor(digits/3);
}
// lines: [[{c,x0,x1},...],...]  ->  array of strings with [chords] inline
function mergeLines(lines){
  var out=[], i=0;
  while(i<lines.length){
    var L=lines[i], txt=lineText(L);
    if(txt.trim() && isChordLine(txt.trim())){
      var nxt=lines[i+1], ntxt=nxt?lineText(nxt):'';
      if(nxt && ntxt.trim() && !isChordLine(ntxt.trim()) && !SEC_RE.test(ntxt)){
        var toks=[], k=0;
        while(k<L.length){
          if(!L[k].c.trim()){ k++; continue; }
          var st=k; while(k<L.length && L[k].c.trim()) k++;
          toks.push([tokClean(lineText(L.slice(st,k))), L[st].x0]);
        }
        var ins={};
        toks.forEach(function(t){
          if(!t[0]) return;
          var cx=t[1], j=nxt.length;
          for(var idx=0; idx<nxt.length; idx++){
            var c=nxt[idx];
            if(cx<c.x1){ var w=Math.max(c.x1-c.x0,0.1); j=(cx<=c.x0+0.5*w)?idx:idx+1; break; }
          }
          (ins[j]=ins[j]||[]).push(t[0]);
        });
        var s='';
        for(var q=0;q<nxt.length;q++){
          (ins[q]||[]).forEach(function(t){ s+='['+t+']'; });
          s+=(nxt[q].c==='\t'?' ':nxt[q].c);
        }
        (ins[nxt.length]||[]).forEach(function(t){ s+='['+t+']'; });
        out.push(s.replace(/\s+$/,'')); i+=2; continue;
      }
      out.push(txt.trim().split(/\s+/).map(function(t){return '['+tokClean(t)+']'}).join(' ')); i++; continue;
    }
    out.push(txt.replace(/\s+$/,'')); i++;
  }
  return out;
}
function snapChords(l){
  if(l.charAt(0)==='{' || l.indexOf('[')<0) return l;
  var VOW='aeiouAEIOU';
  return l.replace(/(^|[^\w'’\]])([A-Za-z])\[([^\]]+)\](?=[A-Za-z])([A-Za-z'’]*)/g, function(all,pre,letter,chord,rest){
    if(VOW.indexOf(letter)>=0 && rest.length+1>=4) return all;
    return pre+'['+chord+']'+letter+rest;
  });
}
function linesToCho(lines, fallback){
  prescan(lines);
  var body=mergeLines(lines);
  while(body.length && !body[0].trim()) body.shift();
  var meta=[], title=fallback, artist=null, key=null;
  if(body.length){
    var b0=body[0].trim(), first;
    if(SEC_RE.test(b0) || b0.indexOf('[')>=0 || b0.length>70 || /[,;]$/.test(b0) || isChordLine(b0)) first=fallback;
    else first=body.shift().trim();
    var m=first.match(/^(.*?),?\s+by\s+(.+)$/i);
    if(m){ title=m[1].trim(); artist=m[2].trim(); } else title=first;
  }
  var taken=0;
  while(body.length && body[0].trim() && taken<3 && body[0].indexOf('[')<0 && !SEC_RE.test(body[0]) && !isChordLine(body[0])){
    var h=body[0].trim(), kk=h.match(/^key\s*:\s*(.+)$/i), a=h.match(/^(?:words\s*(?:&|and)\s*music\s*)?by\s+(.+)$/i);
    if(kk) key=kk[1].trim();
    else if(a && !artist) artist=a[1].trim();
    else if(META_RE.test(h) || CREDIT_RE.test(h) || /^(intro|instrumental|interlude|turnaround|ending)\b/i.test(h)) meta.push(h);
    else break;
    body.shift(); taken++;
  }
  var out=['{title: '+title+'}'];
  if(artist) out.push('{artist: '+artist+'}');
  if(key) out.push('{key: '+key+'}');
  var headMeta=meta.filter(function(x){return !CREDIT_RE.test(x)}), footMeta=meta.filter(function(x){return CREDIT_RE.test(x)});
  headMeta.forEach(function(x){ out.push('{comment: '+x+'}'); });
  var open=null;
  function close(){ if(open){ out.push('{end_of_'+open+'}'); open=null; } }
  var footer=footMeta.map(function(x){return '{comment: '+x+'}'});
  body.forEach(function(l){
    var s=l.match(SEC_RE);
    if(s){
      close();
      var name=s[1].charAt(0).toUpperCase()+s[1].slice(1).toLowerCase(), num=s[2];
      var label=(name+(num?' '+num:'')).replace('Prechorus','Pre-Chorus');
      var typ=name.toLowerCase()==='chorus'?'chorus':(name.toLowerCase()==='bridge'?'bridge':'verse');
      if(out.length && out[out.length-1]!=='') out.push('');
      out.push('{start_of_'+typ+': '+label+'}'); open=typ; return;
    }
    var im=l.match(INLINE_RE);
    if(im && l.slice(0,im.index).trim()){
      l=l.slice(0,im.index)+'  '+im[1].trim().split(/\s+/).map(function(c){return '['+c+']'}).join(' ');
    }
    if(l.indexOf('[')<0 && CREDIT_RE.test(l) && l.trim().length>0 && l.trim().length<110){ footer.push('{comment: '+l.trim()+'}'); return; }
    out.push(snapChords(l));
  });
  close();
  while(out.length && out[out.length-1]==='') out.pop();
  var seen={}; footer=footer.filter(function(x){ if(seen[x]) return false; seen[x]=1; return true; });
  if(footer.length) out=out.concat([''],footer);
  return out.join('\n').replace(/\n{3,}/g,'\n\n')+'\n';
}

/* --- .docx: unzip, then lay the text out like Word does (fonts, tabs) so chords can be placed by position --- */
function u16(d,o){ return d[o]|(d[o+1]<<8); }
function u32(d,o){ return (d[o]|(d[o+1]<<8)|(d[o+2]<<16)|(d[o+3]<<24))>>>0; }
async function zipFile(buf,name){
  var d=new Uint8Array(buf), eocd=-1;
  for(var i=d.length-22;i>=0 && i>d.length-70000;i--){ if(u32(d,i)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not a zip');
  var n=u16(d,eocd+10), off=u32(d,eocd+16);
  for(var e=0;e<n;e++){
    var method=u16(d,off+10), csize=u32(d,off+20), nl=u16(d,off+28), el=u16(d,off+30), cl=u16(d,off+32), lho=u32(d,off+42);
    var fname=new TextDecoder().decode(d.subarray(off+46,off+46+nl));
    if(fname===name){
      var ds=lho+30+u16(d,lho+26)+u16(d,lho+28), data=d.subarray(ds,ds+csize);
      if(method===0) return new TextDecoder().decode(data);
      var stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new TextDecoder().decode(await new Response(stream).arrayBuffer());
    }
    off+=46+nl+el+cl;
  }
  return null;
}
var measureCtx=null;
function measure(font,str){ if(!measureCtx) measureCtx=document.createElement('canvas').getContext('2d'); measureCtx.font=font; return measureCtx.measureText(str).width; }
async function docxToLines(buf){
  var W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  var docXml=await zipFile(buf,'word/document.xml'); if(!docXml) throw new Error('no document');
  var styXml=await zipFile(buf,'word/styles.xml')||'';
  var defSize=11, defFont='Calibri', defTab=36;
  if(styXml){
    var sd=new DOMParser().parseFromString(styXml,'application/xml');
    var dd=sd.getElementsByTagNameNS(W,'docDefaults')[0];
    if(dd){
      var sz=dd.getElementsByTagNameNS(W,'sz')[0]; if(sz) defSize=(+sz.getAttributeNS(W,'val'))/2||defSize;
      var rf=dd.getElementsByTagNameNS(W,'rFonts')[0]; if(rf) defFont=rf.getAttributeNS(W,'ascii')||defFont;
    }
  }
  var doc=new DOMParser().parseFromString(docXml,'application/xml');
  var paras=doc.getElementsByTagNameNS(W,'p'), lines=[];
  function owner(node){ while(node && !(node.namespaceURI===W && node.localName==='p')) node=node.parentNode; return node; }
  for(var pi=0;pi<paras.length;pi++){
    var p=paras[pi], x=0, tabs=[], cur=[];
    var ppr=p.getElementsByTagNameNS(W,'pPr')[0];
    if(ppr && owner(ppr.parentNode)===p){
      var ind=ppr.getElementsByTagNameNS(W,'ind')[0];
      if(ind){ var lft=ind.getAttributeNS(W,'left')||ind.getAttributeNS(W,'start'); if(lft) x=(+lft)/20; }
      var tb=ppr.getElementsByTagNameNS(W,'tabs')[0];
      if(tb) [].slice.call(tb.getElementsByTagNameNS(W,'tab')).forEach(function(t){
        if(t.getAttributeNS(W,'val')!=='clear') tabs.push((+t.getAttributeNS(W,'pos'))/20);
      });
      tabs.sort(function(a,b){return a-b});
    }
    var runs=p.getElementsByTagNameNS(W,'r');
    for(var ri=0;ri<runs.length;ri++){
      var r=runs[ri]; if(owner(r.parentNode)!==p) continue;
      var size=defSize, font=defFont, bold=false, ital=false;
      var rpr=r.getElementsByTagNameNS(W,'rPr')[0];
      if(rpr){
        var z=rpr.getElementsByTagNameNS(W,'sz')[0]; if(z) size=(+z.getAttributeNS(W,'val'))/2||size;
        var f=rpr.getElementsByTagNameNS(W,'rFonts')[0]; if(f) font=f.getAttributeNS(W,'ascii')||font;
        var b=rpr.getElementsByTagNameNS(W,'b')[0]; bold=!!b && b.getAttributeNS(W,'val')!=='0' && b.getAttributeNS(W,'val')!=='false';
        var it=rpr.getElementsByTagNameNS(W,'i')[0]; ital=!!it && it.getAttributeNS(W,'val')!=='0' && it.getAttributeNS(W,'val')!=='false';
      }
      var fnt=(ital?'italic ':'')+(bold?'bold ':'')+size+'px "'+font+'", "Times New Roman", serif';
      for(var ch=r.firstChild; ch; ch=ch.nextSibling){
        if(ch.namespaceURI!==W) continue;
        var ln=ch.localName;
        if(ln==='t'){
          var s=ch.textContent;
          for(var k=0;k<s.length;k++){
            var w=measure(fnt,s.charAt(k)); cur.push({c:s.charAt(k),x0:x,x1:x+w}); x+=w;
          }
        } else if(ln==='tab'){
          var nx=null; for(var q=0;q<tabs.length;q++){ if(tabs[q]>x+0.5){ nx=tabs[q]; break; } }
          if(nx===null) nx=(Math.floor(x/defTab)+1)*defTab;
          cur.push({c:'\t',x0:x,x1:nx}); x=nx;
        } else if(ln==='br' || ln==='cr'){
          lines.push(cur); cur=[]; x=0;
        }
      }
    }
    lines.push(cur);
  }
  return lines;
}

/* --- .pdf: PDF.js (loaded from cdnjs on first use) gives text runs with positions --- */
var pdfjsReady=null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res(window.pdfjsLib);
    };
    s.onerror=function(){ rej(new Error('Could not load the PDF reader. Check your connection.')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function pdfToLines(buf){
  var lib=await loadPdfjs();
  var pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise, all=[];
  for(var pn=1; pn<=Math.min(pdf.numPages,6); pn++){
    var page=await pdf.getPage(pn), tc=await page.getTextContent();
    var items=tc.items.filter(function(it){return it.str && it.str.length});
    items.sort(function(a,b){ return b.transform[5]-a.transform[5]; });
    var rows=[], cy=null;
    items.forEach(function(it){
      var y=it.transform[5];
      if(cy===null || Math.abs(y-cy)>3){ rows.push([]); cy=y; }
      rows[rows.length-1].push(it);
    });
    rows.forEach(function(row){
      row.sort(function(a,b){ return a.transform[4]-b.transform[4]; });
      var L=[], prevEnd=null;
      row.forEach(function(it){
        var x0=it.transform[4], w=it.width||0, n=it.str.length, size=Math.abs(it.transform[0])||10;
        if(prevEnd!==null && x0-prevEnd>size*0.22 && L.length && L[L.length-1].c!==' ' && it.str.charAt(0)!==' '){
          L.push({c:' ',x0:prevEnd,x1:x0});
        }
        for(var i=0;i<n;i++) L.push({c:it.str.charAt(i), x0:x0+w*i/n, x1:x0+w*(i+1)/n});
        prevEnd=x0+w;
      });
      all.push(L);
    });
    all.push([]);
  }
  return all;
}
function textToLines(text){
  return text.replace(/\r/g,'').split('\n').map(function(line){
    var L=[], col=0;
    for(var i=0;i<line.length;i++){
      var ch=line.charAt(i);
      if(ch==='\t'){ var n=(Math.floor(col/8)+1)*8; L.push({c:'\t',x0:col,x1:n}); col=n; }
      else { L.push({c:ch,x0:col,x1:col+1}); col++; }
    }
    return L;
  });
}
function plainToCho(text, base){
  if(/\{\s*(title|t)\s*:/i.test(text) || /\[[A-G1-7][^\]]*\]/.test(text)) return text;   // already ChordPro
  return linesToCho(textToLines(text), base);
}
function sniffOldDoc(buf){ var d=new Uint8Array(buf); return d.length>8 && d[0]===0xD0 && d[1]===0xCF && d[2]===0x11 && d[3]===0xE0; }
async function fileToCho(file){
  var base=file.name.replace(/\.[^.]+$/,'').replace(/\s*\[(?:docx?|pdf)\]\s*$/i,'');
  var buf=await file.arrayBuffer();
  var lower=file.name.toLowerCase();
  if(/\.docx$/.test(lower)){
    if(sniffOldDoc(buf)) throw new Error('old-doc');
    var lines=await docxToLines(buf);
    return linesToCho(lines, base);
  }
  if(/\.pdf$/.test(lower)){
    var pl=await pdfToLines(buf);
    if(!pl.some(function(L){return L.length>0})) throw new Error('no-text');
    return linesToCho(pl, base);
  }
  throw new Error('unsupported');
}

/* import / export */
$('impBtn').onclick=function(){ $('impFile').click(); };
$('impFile').onchange=async function(){
  var files=[].slice.call(this.files); this.value='';
  if(!files.length) return;
  var added=0, notes=[], last=null;
  for(var i=0;i<files.length;i++){
    var f=files[i], lower=f.name.toLowerCase(), text=null;
    try{
      if(/\.docx$|\.pdf$/.test(lower)){ toast('Converting '+f.name+'…'); text=await fileToCho(f); }
      else if(/\.doc$/.test(lower)){ notes.push(f.name+': old .doc format. In Word choose Save As .docx, then import that.'); continue; }
      else text=plainToCho(await f.text(), f.name.replace(/\.[^.]+$/,''));
    }catch(e){
      var msg=e && e.message;
      if(msg==='old-doc') notes.push(f.name+': this is an old .doc file with a .docx name. Open it in Word and Save As .docx.');
      else if(msg==='no-text') notes.push(f.name+': no text found (a scanned picture?).');
      else notes.push(f.name+': could not be read ('+(msg||'error')+').');
      continue;
    }
    if(!/\{\s*(title|t)\s*:/i.test(text)) text='{title: '+f.name.replace(/\.[^.]+$/,'')+'}\n'+text;
    var s={id:uid(),text:text,steps:0,src:f.name}; songs.push(s); last=s; added++;
  }
  if(last) select(last.id);
  if(notes.length) alert(notes.slice(0,6).join('\n\n')+(notes.length>6?'\n\n…and '+(notes.length-6)+' more.':''));
  else if(added) toast('Imported '+added+' file'+(added>1?'s':'')+'.');
};
$('expBtn').onclick=function(){
  var name=(titleOf(cur)||'song').replace(/[\\/:*?"<>|]+/g,'').trim()||'song';
  var blob=new Blob([cur.text],{type:'text/plain'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'.cho';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
};

/* phone: Edit / Sheet tabs */
function setView(v){
  document.body.setAttribute('data-view',v);
  $('tabEdit').classList.toggle('on',v==='edit');
  $('tabSheet').classList.toggle('on',v==='sheet');
}
$('moreBtn').onclick=function(){ document.querySelector('header.bar').classList.toggle('open'); };
$('tabEdit').onclick=function(){ setView('edit'); };
$('tabSheet').onclick=function(){ setView('sheet'); };

/* offline support: a tiny service worker keeps a copy of this page (needs https hosting) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('chords-sw.js?p='+encodeURIComponent(location.pathname))
    .then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){
      if(!LS.get('csm.offlineMsg')){ LS.set('csm.offlineMsg','1'); toast('Saved on this device. It now works offline.'); }
    })
    .catch(function(){});
}

select(cur.id);
if(window.matchMedia('(max-width:800px)').matches && songs.length>1) setView('sheet');
})();
